<!DOCTYPE html>
<!--
================================================================
 EASY LIFESTYLE - AliExpress-style store (ONE file)
 HOW TO USE
  1. Save this text as  index.html
  2. Make a folder called  images  next to it and put your product photos inside
  3. Edit ONLY the parts marked "EDIT HERE" (store info + products)
  4. Upload index.html + the images folder to your hosting for easylifestyle.site
================================================================

<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easy Lifestyle - Shop everything, pay less</title>
<!-- Lexend = main site font (closest match to the AliExpress look). Pacifico = script font of the "Lifestyle" logo -->
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
/* ===== 1. COLOURS (change these to re-brand the whole site) ===== */
:root{--red:#fd384f;--bg:#f5f5f5;--tx:#191919;--mut:#757575;--ln:#e8e8e8;--grn:#17803d;--font:"Lexend",Roboto,Arial,sans-serif} /* --font = the font used across the whole site; change it here */

/* ===== 2. BASE STYLES ===== */
*{box-sizing:border-box;margin:0}
body{font:400 14px/1.45 var(--font);background:var(--bg);color:var(--tx);padding-bottom:70px}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1200px;margin:auto;padding:0 10px}

/* ===== 3. HEADER: logo (top-left) + delivery location, then a STICKY search bar ===== */
.strip{background:#191919;color:#fff;font-size:12px;text-align:center;padding:6px}
header{background:#fff}                                  /* top row scrolls away with the page */
.hd{display:flex;align-items:center;gap:12px;padding:10px 12px 4px}
/* location button next to the logo */
.loc{margin-right:auto;min-width:0;max-width:60%;display:flex;align-items:center;gap:6px;text-align:left;padding:4px 8px;border-radius:10px}
.loc svg{width:20px;height:20px;color:var(--red);flex:none}.loc .ch{color:var(--mut)}
.loc span{display:block;min-width:0}.loc small{font-size:11px;line-height:1.1}
.loc b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk{color:var(--red);cursor:pointer}
/* sticky block = search bar + category tabs (stays stuck while scrolling) */
.stk{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 1px 4px #0002}
.sbw{padding:8px 12px}
.logo{display:flex;align-items:center;flex:none}
.logo b{background:#e0202e;color:#fff;font:700 22px var(--font);padding:2px 8px 4px;border-radius:7px}
.logo i{font:400 25px Pacifico,cursive;color:var(--grn);margin-left:3px}
/* SEARCH BAR: black outline pill + round black search button (AliExpress style) */
.sb{display:flex;align-items:center;border:2px solid var(--tx);border-radius:40px;padding:3px 3px 3px 18px;background:#fff}
.sb input{flex:1;min-width:0;height:42px;border:0;outline:0;background:none;color:var(--tx);font:400 16px var(--font)}
.sb input::placeholder{color:#8a8a8a}
.sb button{flex:none;width:46px;height:46px;border-radius:50%;background:var(--tx);color:#fff;display:grid;place-items:center}
.ic{position:relative;padding:6px}
.bdg{position:absolute;top:-2px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font:700 11px/18px Arial;text-align:center;border:2px solid #fff;box-sizing:content-box}
.bdg[data-n="0"]{display:none}
.bump{animation:bp .35s}@keyframes bp{50%{transform:scale(1.5)}}
/* category tabs under the search bar */
.tabs{display:flex;gap:20px;overflow-x:auto;padding:0 12px;scrollbar-width:none;border-top:1px solid var(--ln)}
.tabs button{flex:none;padding:10px 0;font-weight:600;color:var(--mut);border-bottom:3px solid transparent}
.tabs .on{color:var(--red);border-color:var(--red)}

/* ===== 4. BANNER SLIDER ===== */
.bn{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:12px;margin-top:10px}
.bs{flex:none;width:100%;height:150px;scroll-snap-align:start;display:flex;align-items:center;padding:0 24px;color:#fff}
.bs h2{font-size:26px}.bs p{margin:2px 0 10px}
.bs a{background:#fff;color:var(--red);font-weight:700;padding:7px 18px;border-radius:20px}
@media(min-width:800px){.bs{height:260px;padding:0 60px}.bs h2{font-size:40px}}

/* ===== 5. PRODUCT CARDS + GRID ===== */
h2.h{font-size:18px;font-weight:800;margin:18px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(5,1fr)}}
.pc{position:relative;display:block;background:#fff;border-radius:10px;overflow:hidden}
/* PRODUCT IMAGE: always a square, photo is cropped to fit (same as AliExpress) */
.im{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#f0f0f0}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#b5b5b5;font-size:12px}
.pi{padding:8px 10px 12px}
.pi h3{font-size:13px;font-weight:400;height:36px;overflow:hidden}
.pr{display:flex;align-items:baseline;gap:6px;margin-top:4px;padding-right:34px;flex-wrap:wrap}
.pr b{color:var(--red);font-size:19px}.cu{font-size:12px;font-weight:700}
.pr s{color:var(--mut);font-size:12px}
.pr em{color:var(--red);font-size:12px;font-style:normal;background:#fd384f1a;padding:1px 5px;border-radius:4px}
small{color:var(--mut);font-size:12px;display:block}
.fs{display:inline-block;margin-top:3px;font-size:11px;color:var(--grn);border:1px solid var(--grn);border-radius:4px;padding:0 4px}
.ad{position:absolute;right:8px;bottom:10px;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--tx);display:grid;place-items:center}
.ad svg{width:17px;height:17px}.ad:active{transform:scale(.88)}
/* SuperDeals strip: scrolls sideways */
.deals{background:#fff;border-radius:12px;padding:4px 10px 12px;margin-top:10px}
.deals h2.h{margin:10px 0}.cd{color:var(--red);font-size:14px;margin-left:8px}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.row .pc{flex:none;width:140px;background:none;border-radius:0}

/* ===== 6. PRODUCT PAGE ===== */
.pdp{display:grid;gap:10px;margin-top:10px}
@media(min-width:800px){.pdp{grid-template-columns:1fr 1fr;gap:24px}}
.gl{position:relative;background:#fff;border-radius:12px;overflow:hidden}
.sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.sl>*{flex:none;width:100%;scroll-snap-align:start}
.cnt{position:absolute;right:10px;top:10px;background:#0009;color:#fff;font-size:12px;padding:3px 10px;border-radius:12px}
.th{display:flex;gap:6px;padding:8px;overflow-x:auto}
.th>*{flex:none;width:56px;height:56px;border-radius:8px;border:2px solid transparent;overflow:hidden;opacity:.7}
.th .on{border-color:var(--red);opacity:1}.th .im{height:100%}
.pb{background:linear-gradient(90deg,#fd384f,#ff7a00);color:#fff;border-radius:12px;padding:12px 14px}
.pb b{font-size:30px}.pb s{opacity:.8;margin:0 8px}.pb em{background:#fff;color:var(--red);font:700 12px var(--font);padding:2px 6px;border-radius:4px}
.pb div{font-size:12px;margin-top:2px}
.box{background:#fff;border-radius:12px;padding:14px;margin-top:10px;line-height:1.8}
.box h1{font-size:17px;line-height:1.35}
.vs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.vs button{padding:6px 16px;border:1.5px solid var(--ln);border-radius:20px;font-weight:600}
.vs .on{border-color:var(--red);color:var(--red);background:#fd384f10}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--ln);border-radius:20px}
.qty button{width:34px;height:32px;font-size:18px;font-weight:700}.qty span{min-width:28px;text-align:center;font-weight:700}
/* sticky buy bar (Add to cart / Buy now) */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;gap:8px;align-items:center;padding:8px 12px;background:#fff;box-shadow:0 -2px 8px #0002}
.bar a{position:relative;padding:6px 10px}
.bar .b2,.bar .b3{flex:1;padding:12px;border-radius:26px;font-weight:700;font-size:15px}
.b2{background:#ffe3d1;color:#e8590c}.b3{background:var(--red);color:#fff}
body.pg .bar{display:flex}body.pg nav{display:none}

/* ===== 7. CART, CATEGORIES, ACCOUNT ===== */
.line{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:10px;margin-bottom:8px}
.line .im,.line .ph{width:80px;height:80px;border-radius:8px;flex:none}.line>div:nth-child(2){flex:1;min-width:0}
.x{color:var(--mut);padding:6px;font-size:18px}
.tot{background:#fff;border-radius:12px;padding:14px;margin-top:10px}
.tot p{display:flex;justify-content:space-between;margin:4px 0}
.prog{height:6px;background:var(--ln);border-radius:3px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:var(--grn)}
.go{display:block;width:100%;margin-top:10px;padding:13px;border-radius:26px;background:var(--red);color:#fff;font-weight:700;font-size:16px;text-align:center}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cats button{background:#fff;border-radius:12px;padding:18px 6px;font-weight:600}.cats b{display:block;font-size:32px}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}.empty b{display:block;font-size:54px}

/* ===== 7b. LOCATION PICKER (pop-up from the bottom) ===== */
.ov{position:fixed;inset:0;z-index:100;background:#0007;display:none;align-items:flex-end;justify-content:center}.ov.s{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px;max-height:80vh;overflow:auto}
.sh{display:flex;justify-content:space-between;align-items:center;font-size:17px;margin-bottom:10px}
.lg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lg button{padding:11px 12px;border:1.5px solid var(--ln);border-radius:12px;text-align:left;font-weight:500}
.lg .on{border-color:var(--red);color:var(--red);background:#fd384f10}
.lf{display:flex;gap:8px;margin-top:12px}
.lf input{flex:1;min-width:0;border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;font:inherit;outline:0}
.lf button{background:var(--tx);color:#fff;border-radius:12px;padding:0 18px;font-weight:600}

/* ===== 7c. CHECKOUT PAGE (Order confirmation) ===== */
body.co header,body.co .stk,body.co .strip,body.co nav{display:none}   /* checkout has its own top bar */
body.co{background:#f5f5f5;padding-bottom:96px}body.co #app{padding:0;max-width:640px}
.cohd{display:flex;align-items:center;gap:18px;padding:12px 14px;background:#fff}.cohd a{padding:6px}.cohd h1{font-size:21px;font-weight:500}
.cs{background:#fff;margin-top:10px;padding:16px 14px}.cs h3{font-size:17px;margin-bottom:10px}.cs h3.n{font-weight:500}
.lnk{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left}   /* a row with a ">" at the end */
.lnk .c{flex:1;min-width:0;display:block;line-height:1.7}.r svg{width:18px;height:18px;flex:none}
.add{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500}.add svg{width:20px;height:20px}
.air{height:4px;margin:16px -14px -16px;background:repeating-linear-gradient(90deg,#e2283a 0 22px,transparent 22px 28px,#3b82d6 28px 50px,transparent 50px 56px)} /* red/blue airmail stripe */
.ci{display:flex;gap:14px;margin:12px 0}.ci .im,.ci .ph{width:78px;height:78px;border-radius:10px;flex:none}
.ci>div{flex:1;min-width:0}.ci h4{font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cq{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}.ci .pr{padding:0;margin:0}.ci .pr b{font-size:21px}
.sr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;width:100%}
.sd{background:#f4f6fa;margin:0 -14px;padding:2px 14px;color:var(--mut);font-size:13px}.neg{color:var(--red)}.tt{font-size:24px}
.sec{display:flex;align-items:center;gap:10px;color:var(--grn);font-size:17px;font-weight:700}
.terms{padding:16px 14px;color:var(--mut);font-size:14px}.terms a{color:#1a1aff}
.pay{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;font-size:17px}
.pay button{flex:0 0 52%;height:50px;border-radius:30px;background:#f0052d;color:#fff;font-weight:600;font-size:17px}   /* red "Pay now" */
/* forms inside the pop-up sheets */
.fl{display:block;font-size:14px;margin:12px 0 4px}
.fi{width:100%;border:1.5px solid var(--tx);border-radius:12px;padding:12px;font:400 16px var(--font);outline:0}.fi::placeholder{color:#b5b5b5}
.btn{display:block;width:100%;margin-top:16px;padding:15px;border-radius:30px;background:var(--tx);color:#fff;font-weight:600;font-size:16px}.btn:disabled{background:#d4d4d4}
.err{color:var(--red);font-size:13px;margin-top:6px}.hint{color:var(--mut);font-size:14px;margin-top:10px;line-height:1.5}
.po{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;border:1.5px solid var(--ln);border-radius:12px;text-align:left;margin-bottom:8px}.po.on{border-color:var(--red);background:#fd384f10}.po b{display:block}
.ok{text-align:center;padding:70px 20px}.ok>b{display:block;font-size:56px}

/* ===== 8. BOTTOM TAB BAR (mobile app style) + TOAST MESSAGE ===== */
nav{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0)}
nav a{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:11px;color:var(--mut)}
nav a.on{color:var(--red)}nav .bdg{left:calc(50% + 4px);right:auto}
#t{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#191919;color:#fff;padding:10px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#t.s{opacity:1;transform:translate(-50%,0)}
.ft{text-align:center;color:var(--mut);font-size:12px;margin:26px 0}
</style></head>
<body>

<header>

<script>
/* ================================================================
   EDIT HERE (1/3): STORE SETTINGS
   ================================================================ */
const STORE={
  currency:"₦",          // symbol shown before every price
  freeShipFrom:50000,    // cart total that unlocks free delivery
  location:"Abuja",      // default delivery location (visitors can change it)
  whatsapp:""            // your number WITH country code, no + (e.g. "2348012345678").
                         // If filled, "Pay now" sends the order to your WhatsApp.
};
// Category names + emoji icon (shown in the tabs and the Categories page)
const CATEGORIES=[["Phones","📱"],["Women","👗"],["Men","👔"],["Shoes","👟"],["Bags","👜"],["Home","🏠"],["Beauty","💄"],["Kids","🧸"]];
// Cities shown in the "Deliver to" pop-up (visitors can also type their own city)
const LOCATIONS=["Abuja","Lagos","Port Harcourt","Ibadan","Kano","Enugu","Benin City","Calabar","Owerri","Uyo","Kaduna","Jos"];

// ----- CHECKOUT SETTINGS -----
// Delivery fee by city (any city not listed uses "default"). Orders above freeShipFrom ship free.
const SHIPPING={default:3500,Abuja:1500,Lagos:2500,"Port Harcourt":3000};
const DELIVERY_DAYS=[5,10];   // delivery takes between these many days (shown as "Dec 17 - 22")
// Payment methods shown at checkout: [name, emoji, short note].
// To accept cards online, connect a payment gateway (Paystack / Flutterwave) first, then add a "Card" line here.
const PAYMENTS=[["Bank transfer","🏦","Pay to our bank account; we confirm on WhatsApp"],["Pay on delivery","💵","Pay cash when your order arrives"]];
// Promo codes customers can type at checkout. pct = % off the subtotal, off = fixed amount off.
const PROMOS={WELCOME10:{pct:10},SAVE500:{off:500}};
// Home page banners. bg = colours. img = optional photo (e.g. "images/banner1.jpg")
const BANNERS=[
  {t:"Mega Sale",s:"Up to 70% off today",bg:"linear-gradient(90deg,#fd384f,#ff7a00)",img:"",cat:"All"},
  {t:"New Phones & Gadgets",s:"Free shipping on selected items",bg:"linear-gradient(90deg,#1e3c72,#2a5298)",img:"",cat:"Phones"},

];

/* ================================================================
   EDIT HERE (2/3): YOUR PRODUCTS
   One block per product. To add a product: copy a block, change id.
   id     = unique number            name  = product title
   cat    = must match a category above
   price  = selling price            old   = old price (crossed out). Use 0 for none
   sold   = number sold              rating = stars (0-5)
   images = list of photo paths, FIRST photo is the cover on the home page.
            Example: ["images/1-a.jpg","images/1-b.jpg"]
            Leave [] and a grey "Add photo" box shows instead.
   colors = options shown on the product page (can be sizes too)
   desc   = description text
   ================================================================ */
const PRODUCTS=[
 {id:1,name:"Wireless Bluetooth Earbuds Pro with Charging Case",cat:"Phones",price:18500,old:36000,sold:4800,rating:4.5,images:[],colors:["Black","White"],desc:"Bluetooth 5.3, noise reduction, up to 24 hours playtime with the case."},
 {id:2,name:"Smart Watch Fitness Tracker Waterproof",cat:"Phones",price:24500,old:48000,sold:3300,rating:4.6,images:[],colors:["Black","Silver","Pink"],desc:"Heart-rate monitor, step counter and message alerts."},
 {id:3,name:"Women's Summer Floral Dress",cat:"Women",price:9800,old:19500,sold:5100,rating:4.7,images:[],colors:["Blue","Red","Yellow"],desc:"Light, breathable fabric. Perfect for church, parties and outings."},

 {id:5,name:"Leather Crossbody Bag for Women",cat:"Bags",price:12800,old:24000,sold:1900,rating:4.8,images:[],colors:["Brown","Black"],desc:"Stylish PU leather bag with adjustable strap and zip pockets."},

 {id:8,name:"Vitamin C Brightening Face Serum 30ml",cat:"Beauty",price:5400,old:9800,sold:7300,rating:4.7,images:[],colors:["Standard"],desc:"Brightens skin and fades dark spots. Suitable for all skin types."},
 {id:9,name:"Kids Educational Learning Toy Set",cat:"Kids",price:6900,old:12000,sold:2100,rating:4.9,images:[],colors:["Standard"],desc:"Safe, colourful building blocks that help children learn."},
 {id:10,name:"Men's Slim Fit Polo Shirt",cat:"Men",price:6500,old:11500,sold:3900,rating:4.5,images:[],colors:["Navy","White","Green"],desc:"Soft cotton blend polo with a smart slim fit."},

/* ================================================================
   EDIT HERE (3/3): nothing. Everything below is the store engine.
   ================================================================ */

/* ----- Small helpers ----- */
const $=s=>document.querySelector(s);
const money=n=>`<span class="cu">${STORE.currency}</span>${Number(n).toLocaleString()}`; // price with small currency symbol

// Icons (simple line drawings)

/* ----- PRODUCT IMAGE: shows your photo, or a grey "Add photo" box if missing/broken ----- */
const PH=`<div class="im ph">${ic('image')}<span>Add photo</span></div>`;
const img=(p,i)=>{const src=(p.images||[])[i];return src?`<img class="im" src="${src}" alt="${p.name}" loading="lazy" onerror="this.outerHTML=PH">`:PH};

/* ----- Cart: saved in the visitor's browser so it survives a refresh ----- */
let cart={},cat="All",q="",sc=col,sq=1;   // cat/q = active filter, sc/sq = chosen option + quantity on product page
try{cart=JSON.parse(localStorage.getItem("el-cart")||"{}")}catch(e){}
let loc=STORE.location;try{loc=localStorage.getItem("el-loc")||loc}catch(e){}   // chosen delivery location (remembered)
let addr=null,pay=null,promo=null,sumOpen=true,lastOrder="",lastH="";   // checkout: saved address, payment method, promo code, summary open?, last order no.
try{addr=JSON.parse(localStorage.getItem("el-addr")||"null");pay=localStorage.getItem("el-pay")}catch(e){}   // remembered in the visitor's own browser
const save=()=>{try{localStorage.setItem("el-cart",JSON.stringify(cart))}catch(e){}};
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
// Updates every cart badge (header, bottom bar, product page) and plays a small "pop"
function badge(pop){document.querySelectorAll(".bdg").forEach(e=>{e.textContent=count();e.dataset.n=count();if(pop){e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}})}
function toast(m){const t=$("#t");t.textContent=m;t.classList.add("s");clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove("s"),1700)}
function addCart(id,n,c){const k=id+"|"+c;cart[k]=(cart[k]||0)+n;save();badge(1);toast("Added to cart")}

/* ----- DELIVERY LOCATION: button beside the logo + pop-up picker ----- */
function showLoc(){
  $("#locbtn").innerHTML=`${ic("pin")}<span><small>Deliver to</small><b></b></span><span class="ch">${ic("chev")}</span>`;
  document.querySelectorAll("#locbtn b,.dl").forEach(e=>e.textContent=loc);   // textContent keeps typed text safe
}
function openLoc(){$("#lg").innerHTML=LOCATIONS.map(c=>`<button data-loc="${c}" class="${c==loc?"on":""}">${c}</button>`).join("");$("#li").value="";$("#ov").classList.add("s")}
function setLoc(v){v=v.trim();if(!v)return;loc=v;try{localStorage.setItem("el-loc",v)}catch(e){}showLoc();$("#ov").classList.remove("s");toast("Delivering to "+v);if(location.hash=="#checkout")route()}

/* ================================================================
   CHECKOUT helpers (Order confirmation page)
   ================================================================ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));   // makes typed text safe to show
const R=()=>`<span class="r">${ic("right")}</span>`;                                                  // the small ">" at the end of a row
const mn=n=>STORE.currency+Number(n).toLocaleString();                                                // plain-text price (used in the WhatsApp message)
// Works out every number on the checkout page
function calc(){
  let sub=0,full=0;
  for(const k in cart){const p=find(k.split("|")[0]);sub+=p.price*cart[k];full+=(p.old||p.price)*cart[k]}   // sub = what they pay, full = old prices
  const pr=PROMOS[promo],pd=pr?Math.min(sub,pr.pct?Math.round(sub*pr.pct/100):pr.off):0;                    // promo discount
  const ship=!sub||sub>=STORE.freeShipFrom?0:(SHIPPING[loc]??SHIPPING.default);                             // delivery fee by city
  return{sub,full,disc:full-sub,pd,ship,total:sub-pd+ship};
}
// Delivery dates, e.g. "Dec 17 - 22"
function range(){const a=new Date(),b=new Date(),m=d=>d.toLocaleString("en",{month:"short"});
  a.setDate(a.getDate()+DELIVERY_DAYS[0]);b.setDate(b.getDate()+DELIVERY_DAYS[1]);
  return a.getMonth()==b.getMonth()?`${m(a)} ${a.getDate()} - ${b.getDate()}`:`${m(a)} ${a.getDate()} - ${m(b)} ${b.getDate()}`}

/* ----- POP-UP SHEETS: shipping address, payment method, promo code ----- */
function sheet(title,html){$("#sheet2").innerHTML=`<div class="sh"><b>${title}</b><button class="x" data-close aria-label="Close">✕</button></div>${html}`;$("#ov2").classList.add("s")}
const closeSheet=()=>$("#ov2").classList.remove("s");
function sheetAddr(){const a=addr||{};
  sheet("Shipping address",`<form id="af">
   <label class="fl">Full name</label><input class="fi" name="name" required value="${esc(a.name||"")}" placeholder="Full name">
   <label class="fl">Phone number</label><input class="fi" name="phone" required inputmode="tel" value="${esc(a.phone||"")}" placeholder="+234 ...">
   <label class="fl">Street address</label><input class="fi" name="line" required value="${esc(a.line||"")}" placeholder="House number, street, area">
   <label class="fl">City / town</label><input class="fi" name="city" required value="${esc(a.city||loc)}">
   <label class="fl">State</label><input class="fi" name="state" required value="${esc(a.state||"")}" placeholder="e.g. FCT">
   <button class="btn">${addr?"Save address":"Add New Address"}</button></form>`)}
function sheetPay(){sheet("Payment method",PAYMENTS.map(([n,i,d])=>`<button class="po ${n==pay?"on":""}" data-pm="${esc(n)}"><span style="font-size:26px">${i}</span><span><b>${n}</b><small>${d}</small></span></button>`).join(""))}
function sheetPromo(){sheet("Promo code",`<label class="fl">Promo code<span class="neg">*</span></label><input class="fi" id="pi" placeholder="Please input..." autocomplete="off" autocapitalize="off"><p class="err" id="pe"></p>
  <p class="hint">Promo codes are a combination of case sensitive letters and numbers, without spaces. Promo codes have limitation and expiration dates.</p><button class="btn" id="pa" disabled>Apply</button>`)}
function setPay(v){pay=v;try{localStorage.setItem("el-pay",v)}catch(e){}closeSheet();route()}
function applyPromo(){const v=$("#pi").value.trim();
  if(PROMOS[v]){promo=v;closeSheet();route();toast("Promo code applied")}else $("#pe").textContent="This promo code is invalid or has expired."}

/* ----- "Pay now": checks address + payment method, then sends the order to your WhatsApp ----- */
function placeOrder(){
  if(!addr){toast("Please add a shipping address");return sheetAddr()}
  if(!pay){toast("Please add a payment method");return sheetPay()}
  if(!STORE.whatsapp)return toast("Orders are not connected yet: add your WhatsApp number in the store settings");
  const c=calc(),no="EL"+Date.now().toString().slice(-6);
  const lines=Object.keys(cart).map(k=>{const[id,v]=k.split("|"),p=find(id);return`${cart[k]} x ${p.name} (${v}) - ${mn(p.price*cart[k])}`});
  const msg=`NEW ORDER ${no}\n${lines.join("\n")}\nSubtotal: ${mn(c.sub)}\n`+(c.pd?`Promo ${promo}: -${mn(c.pd)}\n`:"")+`Shipping: ${mn(c.ship)}\nTOTAL: ${mn(c.total)}\nPayment: ${pay}\nName: ${addr.name}\nPhone: ${addr.phone}\nAddress: ${addr.line}, ${addr.city}, ${addr.state}\nDelivery: ${range()}`;
  window.open("https://wa.me/"+STORE.whatsapp+"?text="+encodeURIComponent(msg),"_blank");
  lastOrder=no;cart={};promo=null;save();badge();location.hash="done";        // clear the cart and show the "Order sent" page
}

<div class="pr"><b>${money(p.price)}</b>${p.old?`<s>${money(p.old)}</s><em>-${off(p)}%</em>`:""}</div>
<small>${sold(p.sold)}</small><span class="fs">Free shipping</span></div>
<button class="ad" data-add="${p.id}" aria-label="Add to cart">${ic("cart")}</button></a>`;

 // ---- LANDING PAGE: banner, SuperDeals, product grid ----

 // ---- CATEGORIES PAGE ----

 // ---- ACCOUNT PAGE (placeholder: real sign-in needs a back-end) ----
 me(){return`<div class="box"><h1>Welcome to Easy Lifestyle</h1><p style="color:var(--mut)">Sign in to track orders and save favourites.</p><a class="go" href="#home">Sign in / Register</a></div><div class="box">📦 My orders<br>❤️ Wishlist<br>🎟️ Coupons<br>💬 Help centre</div>`},
 // ---- CART PAGE ----
 cart(){

 // ---- ORDER SENT PAGE ----

/* ================================================================
   ROUTER: reads the address (#home, #cart, #product-3 ...) and shows the page
   ================================================================ */
function route(){
  const h=location.hash.slice(1)||"home",m=h.match(/^product-(\d+)$/),v=m?"product":view[h]?h:"home";
  document.body.classList.toggle("pg",v=="product");
  document.body.classList.toggle("co",v=="checkout");                 // checkout hides the normal header and tabs                 // hides bottom tabs on product page
  $("#app").innerHTML=m?view.product(m[1]):view[v]();
  $("#tabs").innerHTML=["All",...CATEGORIES.map(c=>c[0])].map(n=>`<button data-cat="${n}" class="${cat==n?"on":""}">${n}</button>`).join("");
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v==v));
  const sl=$("#sl");                                                // gallery: update "1/5" counter + thumbnails while swiping
  if(sl)sl.onscroll=()=>{const i=Math.round(sl.scrollLeft/sl.clientWidth);$("#cnt").textContent=(i+1)+"/"+sl.children.length;document.querySelectorAll("#th>*").forEach((t,j)=>t.classList.toggle("on",i==j))};
  badge();tick();showLoc();if(h!=lastH)scrollTo(0,0);lastH=h;   // only jump to top when the page changes
}
// Countdown to midnight, shown next to "SuperDeals" and "Big Sale"
function tick(){const e=new Date();e.setHours(24,0,0,0);const s=Math.floor((e-new Date())/1000),p=n=>String(n).padStart(2,"0");
  document.querySelectorAll(".cd").forEach(x=>x.textContent=` ${p(Math.floor(s/3600))}:${p(Math.floor(s/60)%60)}:${p(s%60)}`)}

/* ----- Build the fixed parts once: header icons + bottom tab bar ----- */
$("#sbtn").innerHTML=ic("search");$("#hc").innerHTML=ic("cart")+'<span class="bdg"></span>';
$("#nav").innerHTML=[["home","Home","home"],["cats","Categories","grid"],["cart","Cart","cart"],["me","Account","user"]]
  .map(([k,l,i])=>`<a href="#${k}" data-v="${k}">${ic(i)}${l}${k=="cart"?'<span class="bdg"></span>':""}</a>`).join("");

/* ================================================================
   CLICKS (one listener handles every button on the site)
   ================================================================ */
document.addEventListener("click",e=>{const c=s=>e.target.closest(s);let b;
 if(c("#locbtn,[data-openloc]"))openLoc();                                                                // open the location pop-up
 else if(b=c("[data-loc]"))setLoc(b.dataset.loc);                                                         // pick a city from the list
 else if(c("#lx")||e.target.id=="ov")$("#ov").classList.remove("s");                                      // close the pop-up
 else if(b=c("[data-add]")){e.preventDefault();addCart(+b.dataset.add,1,col(find(b.dataset.add)))}          // "+" cart button on a card
 else if(b=c("[data-cat]")){cat=b.dataset.cat;q="";$("#q").value="";location.hash!=="#home"?location.hash="home":route()} // category tab / tile / banner
 else if(b=c("[data-th]")){const sl=$("#sl");sl.scrollTo({left:b.dataset.th*sl.clientWidth,behavior:"smooth"})}      // thumbnail -> big photo
 else if(b=c("[data-c]")){sc=b.dataset.c;document.querySelectorAll(".vs button").forEach(x=>x.classList.toggle("on",x==b))} // choose option
 else if(b=c("[data-s]")){sq=Math.max(1,sq+ +b.dataset.s);$("#sq").textContent=sq}                      // quantity − / +
 else if(b=c("[data-addsel]"))addCart(+b.dataset.addsel,sq,sc)                                           // Add to cart (product page)
 else if(b=c("[data-buy]")){addCart(+b.dataset.buy,sq,sc);location.hash="checkout"}                          // Buy now
 else if(b=c("[data-q]")){const k=b.dataset.k;cart[k]+=+b.dataset.q;if(cart[k]<1)delete cart[k];save();route()} // cart quantity
 else if(b=c("[data-rm]")){delete cart[b.dataset.rm];save();route()}                                     // remove from cart
 else if(c("[data-pay]"))location.hash="checkout";                                                        // Cart "Checkout" -> order confirmation page
 else if(c("[data-addr]"))sheetAddr();                                                                    // "+ Add address" row
 else if(c("[data-paysheet]"))sheetPay();                                                                 // "+ Add payment method" row
 else if(b=c("[data-pm]"))setPay(b.dataset.pm);                                                           // choose a payment method
 else if(c("[data-promo]"))sheetPromo();                                                                  // Promo code row
 else if(c("#pa"))applyPromo();                                                                           // Apply promo
 else if(c("[data-sum]")){sumOpen=!sumOpen;route()}                                                       // show / hide summary details
 else if(c("[data-place]"))placeOrder();                                                                  // Pay now
 else if(c("[data-close]")||e.target.id=="ov2")closeSheet();                                              // close the pop-up
});

/* ----- Search: filters products as the visitor types ----- */
$("#q").addEventListener("input",e=>{q=e.target.value;cat="All";location.hash!=="#home"&&location.hash!==""?location.hash="home":route()});

/* ----- Start-up ----- */
addEventListener("hashchange",route);
$("#lf").addEventListener("submit",e=>{e.preventDefault();setLoc($("#li").value)});                  // typed city -> Save
addEventListener("keydown",e=>{if(e.key=="Escape"){$("#ov").classList.remove("s");closeSheet()}});         // Esc closes pop-ups
document.addEventListener("input",e=>{if(e.target.id=="pi")$("#pa").disabled=!e.target.value.trim()});     // Apply button turns on when a code is typed
document.addEventListener("submit",e=>{if(e.target.id!="af")return;e.preventDefault();                       // address form saved
  addr=Object.fromEntries(new FormData(e.target));try{localStorage.setItem("el-addr",JSON.stringify(addr))}catch(x){}
  closeSheet();setLoc(addr.city)});                                                                          // city also becomes the delivery location                      // Esc closes the pop-up
let hi=0;$("#q").placeholder=HINTS[0];                                                               // rotating search suggestions
setInterval(()=>{if(document.activeElement!==$("#q")){hi=(hi+1)%HINTS.length;$("#q").placeholder=HINTS[hi]}},3000);
setInterval(tick,1000);                                              // countdown ticks every second
setInterval(()=>{const b=$("#bn");if(b)b.scrollTo({left:((Math.round(b.scrollLeft/b.clientWidth)+1)%BANNERS.length)*b.clientWidth,behavior:"smooth"})},4000); // banner auto-slides
route();
</script>
</body></html>
